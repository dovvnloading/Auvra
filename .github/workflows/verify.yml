name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  editor-build:
    name: Editor build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13.0", "24.x"]
    defaults:
      run:
        working-directory: fbx-viewer (1)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: fbx-viewer (1)/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify host protocol
        run: npm run protocol:verify

      - name: Verify native project boundary
        run: npm run project:verify

      - name: Verify provider boundary
        run: npm run provider:verify

      - name: Verify renderer contracts and ownership
        run: npm run renderer:verify

      - name: Verify whole-program diagnostics coverage
        run: npm run diagnostics:verify

      - name: Verify desktop frame boundaries
        run: node scripts/frame/verify.mjs

      - name: Verify the game player leaves out the editor
        run: npm run player:verify

      - name: Check for mistakes in the frontend
        run: npm run lint

      - name: Typecheck the full editor program
        run: npm run typecheck

      - name: Typecheck strict frontend boundaries
        run: npm run typecheck:strict

      - name: Run frontend unit and component tests
        run: npm test

      - name: Build editor
        run: npm run build

  rendering:
    name: Rendering pictures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fbx-viewer (1)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: fbx-viewer (1)/package-lock.json

      - name: Install editor dependencies
        run: npm ci

      - name: Draw the scenes and compare them with the kept pictures
        run: npm run rendering:verify

      - name: Compare what they cost with main
        if: ${{ !cancelled() && hashFiles('fbx-viewer (1)/tests/visual/output/numbers.json') != '' }}
        run: |
          history="$RUNNER_TEMP/rendering-history.jsonl"
          if git fetch --depth=1 origin rendering-history; then git show FETCH_HEAD:history.jsonl > "$history"; fi
          node scripts/rendering/history.mjs compare tests/visual/output/numbers.json "$history"

      - name: Keep the pictures with the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendering-pictures
          path: fbx-viewer (1)/tests/visual/output
          retention-days: 14

  rendering-history:
    name: Rendering history
    needs: rendering
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rendering-history
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch what the scenes cost
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendering-pictures
          path: ${{ runner.temp }}/rendering-pictures

      - name: Add this commit to the history
        run: |
          cp "fbx-viewer (1)/scripts/rendering/history.mjs" "$RUNNER_TEMP/history.mjs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin rendering-history; then
            git switch --force-create rendering-history FETCH_HEAD
          else
            git switch --orphan rendering-history
          fi
          node "$RUNNER_TEMP/history.mjs" record "$RUNNER_TEMP/rendering-pictures/numbers.json" history.jsonl "$GITHUB_SHA"
          git add history.jsonl
          git commit -m "Rendering cost at $GITHUB_SHA"
          git push origin rendering-history

  python-verify:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check uv and locked environment
        run: |
          uv --version
          uv sync --locked --no-install-project --no-dev

      - name: Check Python syntax
        run: uv run --locked --no-sync python -m compileall -q Auvra tests

      - name: Run Python tests
        run: uv run --locked --no-sync python -W error::ResourceWarning -m unittest discover -s tests -t . -v

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check for mistakes in the Python
        run: uvx ruff@0.14.3 check Auvra tests tools

  native-engine-build:
    name: Native engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: native
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Configure headless software Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "AUVRA_WGPU_FORCE_FALLBACK_ADAPTER=1" >> "$GITHUB_ENV"

      - name: Check native formatting
        run: cargo +1.98.0 fmt -- --check

      - name: Check for mistakes in the native engine
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings

      - name: Run locked native tests
        run: cargo +1.98.0 test --locked

      - name: Build locked native engine
        run: cargo +1.98.0 build --release --locked

      - name: Run headless deterministic native acceptance
        env:
          AUVRA_NATIVE_SESSION_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: cargo +1.98.0 run --release --locked -- --headless-self-test

      - name: Run native reference lifecycle
        if: runner.os == 'Windows'
        env:
          AUVRA_NATIVE_SESSION_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: cargo +1.98.0 run --release --locked -- --self-test

  desktop-player-build:
    name: Desktop game player (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: player-desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Check player formatting
        run: cargo +1.98.0 fmt -- --check

      - name: Check for mistakes in the player
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings

      - name: Run locked player tests
        run: cargo +1.98.0 test --locked

      - name: Build locked desktop player
        run: cargo +1.98.0 build --release --locked

  desktop-player-linux:
    name: Desktop game player (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player-desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install WebKitGTK 4.1 and libsoup 3 development packages
        run: |
          sudo apt-get update
          # Headers and libraries only: the recommended extras (portals, docs, GObject introspection data)
          # add many packages to a download that is slow on some runner mirrors.
          sudo apt-get install --yes --no-install-recommends pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libdbus-1-dev

      - name: Select pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Check player formatting
        run: cargo +1.98.0 fmt -- --check

      - name: Check for mistakes in the player
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings

      - name: Run locked player tests
        run: cargo +1.98.0 test --locked

      - name: Build locked Linux game player
        run: cargo +1.98.0 build --release --locked

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Stage the player with its third-party notices
        working-directory: .
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          mkdir -p player-desktop/dist/linux-x64
          cp player-desktop/target/release/auvra-player player-desktop/dist/linux-x64/auvra-player
          chmod 0755 player-desktop/dist/linux-x64/auvra-player
          file player-desktop/dist/linux-x64/auvra-player
          python -m release.notices rust --strict --manifest-dir player-desktop --target x86_64-unknown-linux-gnu --output player-desktop/dist/linux-x64/THIRD_PARTY_NOTICES.txt

      - name: Upload Linux game player
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auvra-player-linux-x64
          path: player-desktop/dist/linux-x64/
          if-no-files-found: error

  desktop-player-macos:
    name: Desktop game player (macos-latest)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: player-desktop
    env:
      # Matches LSMinimumSystemVersion in the Info.plist of exported macOS games.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup target add --toolchain 1.98.0 x86_64-apple-darwin aarch64-apple-darwin

      - name: Check player formatting
        run: cargo +1.98.0 fmt -- --check

      - name: Run locked player tests
        run: cargo +1.98.0 test --locked

      - name: Build locked macOS game player for x86_64 and arm64
        run: |
          cargo +1.98.0 build --release --locked --target x86_64-apple-darwin
          cargo +1.98.0 build --release --locked --target aarch64-apple-darwin

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Stage the universal player with its third-party notices
        working-directory: .
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          mkdir -p player-desktop/dist/macos
          lipo -create -output player-desktop/dist/macos/auvra-player player-desktop/target/x86_64-apple-darwin/release/auvra-player player-desktop/target/aarch64-apple-darwin/release/auvra-player
          lipo player-desktop/dist/macos/auvra-player -verify_arch x86_64 arm64
          # Ad-hoc sign every slice; Apple silicon refuses to run unsigned code.
          codesign --force --sign - player-desktop/dist/macos/auvra-player
          codesign --verify --verbose player-desktop/dist/macos/auvra-player
          chmod 0755 player-desktop/dist/macos/auvra-player
          lipo -info player-desktop/dist/macos/auvra-player
          python -m release.notices rust --strict --manifest-dir player-desktop --target x86_64-apple-darwin --target aarch64-apple-darwin --output player-desktop/dist/macos/THIRD_PARTY_NOTICES.txt

      - name: Upload macOS game player
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auvra-player-macos
          path: player-desktop/dist/macos/
          if-no-files-found: error

  native-project-smoke:
    name: Native project lifecycle (Windows WebView2)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: fbx-viewer (1)/package-lock.json

      - name: Install locked editor dependencies
        working-directory: fbx-viewer (1)
        run: npm ci

      - name: Build editor bundle
        working-directory: fbx-viewer (1)
        run: npm run build

      - name: Select pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build locked native engine
        working-directory: native
        run: cargo +1.98.0 build --release --locked

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Prepare locked Python environment
        run: uv sync --locked --no-install-project --no-dev

      - name: Verify correlated native runtime diagnostics
        env:
          AUVRA_NATIVE_TRACE_SMOKE: "1"
        run: uv run --locked --no-sync python -W error::ResourceWarning -m unittest tests.desktop.test_native_trace_smoke -v

      - name: Run real WebView2 project lifecycle
        env:
          AUVRA_NATIVE_SMOKE: "1"
        run: uv run --locked --no-sync python -W error::ResourceWarning -m unittest tests.desktop.test_native_smoke -v

  release-dev-msix:
    name: Clean Windows unsigned dev MSIX
    runs-on: windows-latest
    needs: [desktop-player-linux, desktop-player-macos]
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: fbx-viewer (1)/package-lock.json

      - name: Build locked frontend
        working-directory: fbx-viewer (1)
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build locked native engine
        working-directory: native
        run: cargo +1.98.0 build --release --locked

      - name: Build locked Windows game player
        working-directory: player-desktop
        run: cargo +1.98.0 build --release --locked

      - name: Download Linux game player
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auvra-player-linux-x64
          path: player-desktop/dist/linux-x64

      - name: Download macOS game player
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auvra-player-macos
          path: player-desktop/dist/macos

      - name: Set up CPython and locked host environment
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14.7"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14.7"

      - name: Prepare locked Python environment
        run: uv sync --locked --no-install-project --no-dev

      - name: Acquire exact pinned runtime payloads
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'auvra-runtime-inputs'
          pwsh -NoProfile -File release/acquire-runtime.ps1 -Output $runtime
          $sdkCache = Join-Path $env:RUNNER_TEMP 'auvra-webview2-sdk-cache'
          uv run --locked --no-sync python -c "from pathlib import Path; from Auvra.desktop.sdk import acquire_sdk; acquire_sdk(Path(r'$sdkCache'))"
          $sdk = Get-ChildItem -LiteralPath $sdkCache -Directory | Where-Object { $_.Name -like 'microsoft.web.webview2-*' } | Select-Object -First 1
          if (-not $sdk) { throw 'verified WebView2 SDK cache entry is missing' }
          "AUVRA_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AUVRA_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage exact package inputs
        shell: pwsh
        run: |
          $hostInput = Join-Path $env:RUNNER_TEMP 'auvra-host-input'
          New-Item -ItemType Directory -Path $hostInput -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'Auvra') -Destination $hostInput -Recurse -Force
          $hostAuvra = Join-Path $hostInput 'Auvra'
          Remove-Item -LiteralPath (Join-Path $hostAuvra 'Auvra.py'), (Join-Path $hostAuvra 'Auvra.pyproj'), (Join-Path $hostAuvra 'launcher\bootstrap.py') -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $hostAuvra -Directory -Filter '__pycache__' -Recurse | Remove-Item -Recurse -Force
          # Host modules resolve protocol/v1 and project/v1 beside Auvra; ship only the schema files.
          foreach ($schemaDir in 'protocol\v1', 'project\v1') {
            $schemaTarget = Join-Path $hostInput $schemaDir
            New-Item -ItemType Directory -Path $schemaTarget -Force | Out-Null
            Copy-Item -Path (Join-Path (Join-Path $env:GITHUB_WORKSPACE $schemaDir) '*.schema.json') -Destination $schemaTarget -Force
          }
          $licenses = Join-Path $env:RUNNER_TEMP 'auvra-license-input'
          New-Item -ItemType Directory -Path $licenses -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') -Destination (Join-Path $licenses 'Auvra-LICENSE')
          $site = Join-Path $env:RUNNER_TEMP 'auvra-site-packages'
          New-Item -ItemType Directory -Path $site -Force | Out-Null
          Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.venv\Lib\site-packages') -Force | Copy-Item -Destination $site -Recurse -Force
          Get-ChildItem -LiteralPath $site -Directory -Filter '__pycache__' -Recurse | Remove-Item -Recurse -Force
          $developmentSuffixes = '.pyc', '.pdb', '.ilk', '.obj', '.lib', '.exp', '.map', '.log', '.dmp', '.dump'
          Get-ChildItem -LiteralPath $site -File -Recurse | Where-Object { $developmentSuffixes -contains $_.Extension.ToLowerInvariant() } | Remove-Item -Force
          $stage = Join-Path $env:RUNNER_TEMP 'auvra-stage-inputs'
          pwsh -NoProfile -File release/stage_inputs.ps1 -Frontend (Join-Path $env:GITHUB_WORKSPACE 'fbx-viewer (1)\dist') -PythonEmbed (Join-Path $env:AUVRA_RUNTIME 'python-embed') -PythonSitePackages $site -WebView2Sdk $env:AUVRA_SDK -WebView2Fixed (Join-Path $env:AUVRA_RUNTIME 'webview2-fixed') -NativeBinary (Join-Path $env:GITHUB_WORKSPACE 'native\target\release\auvra-native.exe') -GamePlayerBinary (Join-Path $env:GITHUB_WORKSPACE 'player-desktop\target\release\auvra-player.exe') -LinuxGamePlayerBinary (Join-Path $env:GITHUB_WORKSPACE 'player-desktop\dist\linux-x64\auvra-player') -MacGamePlayerBinary (Join-Path $env:GITHUB_WORKSPACE 'player-desktop\dist\macos\auvra-player') -HostInput $hostInput -Licenses $licenses -Output $stage
          "AUVRA_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble and MakeAppx-validate unsigned dev package
        shell: pwsh
        env:
          AUVRA_NATIVE_SESSION_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'auvra-package-staging'
          $msix = Join-Path $env:RUNNER_TEMP 'Auvra.Dev.msix'
          $makeAppx = Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Filter MakeAppx.exe -Recurse | Sort-Object FullName | Select-Object -Last 1
          if (-not $makeAppx) { throw 'Windows SDK MakeAppx.exe is required' }
          python -m release.pipeline assemble --input-root $env:AUVRA_STAGE --output $staging --channel dev --version "0.0.0.${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m release.pipeline package --staging $staging --output $msix --makeappx $makeAppx.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unpacked = Join-Path $env:RUNNER_TEMP 'auvra-package-unpacked'
          & $makeAppx.FullName unpack /p $msix /d $unpacked /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m release.pipeline verify --package-root $unpacked --channel dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONNOUSERSITE = '1'
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:AUVRA_RELEASE_NON_UI_SMOKE = '1'
          & (Join-Path $unpacked 'runtime\python\python.exe') -S (Join-Path $unpacked 'host\auvra_startup.py')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'offline packaged startup non-UI smoke (manifest and host schemas): OK'
          $env:AUVRA_RELEASE_SMOKE = '1'
          $env:AUVRA_RELEASE_PACKAGE_ROOT = $unpacked
          uv run --locked --no-sync python -W error::ResourceWarning -m unittest tests.desktop.test_release_smoke -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked --no-sync python -m unittest discover -s tests/release -t . -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Unsigned CI intentionally does not claim MSIX installation, upgrade, rollback, or uninstall success; those require a trusted signing identity on a clean machine.'

      - name: Upload unsigned dev MSIX
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Auvra-dev-msix-${{ github.run_number }}
          path: ${{ runner.temp }}/Auvra.Dev.msix
          if-no-files-found: error
