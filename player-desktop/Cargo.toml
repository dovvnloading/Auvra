[package]
name = "auvra-player"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Standalone desktop player for games exported by Auvra"
publish = false

[dependencies]
serde_json = "1"
tao = "0.37.2"
wry = "0.57.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.clippy]
# Shape, not mistakes: a math routine indexes by axis, and a GPU call takes what it takes.
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
needless_range_loop = "allow"
