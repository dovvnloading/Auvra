[package]
name = "auvra-player"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Standalone desktop player for games exported by Auvra"
publish = false

[dependencies]
serde_json = "1"
tao = "0.37.2"
wry = "0.57.1"

# GTK3/Wry pins the glib 0.18 line, while RUSTSEC-2024-0429 is fixed only
# upstream in >=0.20. This commit-pinned 0.18.5 backport applies just the
# upstream VariantStrIter FFI mutability fix (gtk-rs/gtk-rs-core#1343).
# Remove when the Linux Wry/GTK stack can use maintained glib >=0.20.
[patch.crates-io]
glib = { git = "https://github.com/andrew-wommack-ministries/glib-rustsec-2024-0429-backport", rev = "7e91f1a9420fd3e6c58b7913bbbf201888304ea9" }

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.clippy]
# Shape, not mistakes: a math routine indexes by axis, and a GPU call takes what it takes.
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
needless_range_loop = "allow"
